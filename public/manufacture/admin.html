/* PORTAL_BASE_URL_INJECT */

let MFR_SCOPE = sessionStorage.getItem(SCOPE_KEY) || "full";

/* ============================== ICONS (lucide-style inline svg) ============================== */

  factory: '<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a1 1 0 0 0-1.6-.8L14 12V8a1 1 0 0 0-1.6-.8L6 12V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>',

function icon(name, size = 14, cls = "") {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${ICONS[name]}</svg>`;
}

/* ============================== HELPERS ============================== */
const DAY = 86400000;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function todayISO() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString().slice(0, 10); }
function daysDiff(iso) { if (!iso) return null; const d = new Date(iso + "T00:00:00"); const t = new Date(todayISO() + "T00:00:00"); return Math.round((d - t) / DAY); }
function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "2-digit" }); }
function fmtINR(n) { if (n == null || isNaN(n)) return "₹0"; return "₹" + Math.round(n).toLocaleString("en-IN"); }
function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 9).toUpperCase(); }

function statusLight(s) {
  if (s.stage === "Closed") return "grey";
  const due = s.nextDue || s.targetDate;
  const dr = daysDiff(due);
  if (dr == null) return "grey";
  if (dr < 0) return "red";
  if (dr <= 2) return "yellow";
  return "green";
}
function daysOpen(s) {
  if (!s.requestDate) return null;
  const end = (s.stage === "Closed" && s.dateReceived) ? s.dateReceived : todayISO();
  return Math.round((new Date(end + "T00:00:00") - new Date(s.requestDate + "T00:00:00")) / DAY);
}
function daysRemaining(s) { return daysDiff(s.nextDue || s.targetDate); }
function daysOverdue(s) {
  const dr = daysRemaining(s);
  if (dr == null || s.stage === "Closed") return 0;
  return dr < 0 ? -dr : 0;
}
function costTotal(c) {
  if (!c) return 0;
  return ["fabricCost", "trims", "cmt", "wash", "labels", "packaging", "courier", "other"]
    .reduce((sum, k) => sum + (Number(c[k]) || 0), 0);
}
function orderQty(o) { return (o.breakdown || []).reduce((sum, r) => sum + (Number(r.qty) || 0), 0); }
function orderValue(o) { return orderQty(o) * (Number(o.unitPrice) || 0); }
function orderBalance(o) { return orderValue(o) - (Number(o.advancePaid) || 0); }
function productionLight(o) {
  if (o.currentStage === "Delivered") return "grey";
  const dr = daysDiff(o.expectedDelivery);
  if (dr == null) return "grey";
  if (dr < 0) return "red";
  if (dr <= 5) return "yellow";
  return "green";
}
const LIGHT_DOT = { green: "bg-emerald-500", yellow: "bg-amber-500", red: "bg-rose-500", grey: "bg-neutral-300" };
const LIGHT_TEXT = { green: "text-emerald-700", yellow: "text-amber-700", red: "text-rose-700", grey: "text-neutral-500" };
const LIGHT_BG = { green: "bg-emerald-50", yellow: "bg-amber-50", red: "bg-rose-50", grey: "bg-neutral-100" };
const LIGHT_LABEL = { green: "On track", yellow: "Due soon", red: "Overdue", grey: "Closed" };
const LIGHT_ORDER = { red: 0, yellow: 1, green: 2, grey: 3 };

/* ============================== API ============================== */
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  const res = await fetch(path, { ...opts, headers });
  let body = {}; try { body = await res.json(); } catch (e) { /* non-json */ }
  if (!res.ok) { const err = new Error(body.error || ("Request failed (" + res.status + ")")); err.status = res.status; throw err; }
  return body;
}

/* ============================== SMALL PRIMITIVES ============================== */
function dot(light) { return `<span class="inline-block w-2 h-2 rounded-full ${LIGHT_DOT[light]}"></span>`; }
function statusPill(light) {
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 text-[11px] font-medium rounded-sm ${LIGHT_BG[light]} ${LIGHT_TEXT[light]}">${dot(light)} ${LIGHT_LABEL[light]}</span>`;
}
function kpi(label, value, mono = true, accent = "") {
  return `<div class="px-4 py-3 border-r border-neutral-200 last:border-r-0">
    <div class="text-[10px] font-semibold tracking-wider uppercase text-neutral-400 mb-1">${esc(label)}</div>
    <div class="text-2xl font-black ${mono ? "font-mono tabular-nums" : ""} ${accent || "text-neutral-900"}">${value}</div>
  </div>`;
}
function bar(label, count, max) {
  const pct = max > 0 ? Math.max(3, Math.round((count / max) * 100)) : 0;
  return `<div class="flex items-center gap-3 py-1.5">
    <div class="w-28 text-xs text-neutral-600 shrink-0">${esc(label)}</div>
    <div class="flex-1 h-4 bg-neutral-100 rounded-sm overflow-hidden"><div class="h-full bg-neutral-800 rounded-sm transition-all" style="width:${pct}%"></div></div>
    <div class="w-6 text-xs font-mono text-neutral-700 text-right shrink-0">${count}</div>
  </div>`;
}
function sectionHeading(index, title, action = "") {
  return `<div class="flex items-center justify-between mb-3 mt-8 first:mt-0">
    <h2 class="text-[13px] font-bold tracking-wide text-neutral-900 flex items-baseline gap-2">
      <span class="text-neutral-300 font-mono">${esc(index)}</span><span class="uppercase">${esc(title)}</span>
    </h2>${action}</div>`;
}
function emptyState(iconName, title, hint, action = "") {
  return `<div class="flex flex-col items-center justify-center text-center py-14 border border-dashed border-neutral-300 rounded-sm bg-neutral-50">
    ${icon(iconName, 22, "text-neutral-300 mb-3")}
    <p class="text-sm font-medium text-neutral-600">${esc(title)}</p>
    ${hint ? `<p class="text-xs text-neutral-400 mt-1 max-w-xs">${esc(hint)}</p>` : ""}${action}</div>`;
}
function field(label, inner, span = false) {
  return `<label class="flex flex-col gap-1 ${span ? "col-span-2" : ""}">
    <span class="text-[10px] font-semibold tracking-wider uppercase text-neutral-400">${esc(label)}</span>${inner}</label>`;
}
const INPUT_CLS = 'w-full border border-neutral-300 rounded-sm px-2.5 py-1.5 text-sm text-neutral-900 bg-white focus:outline-none focus:ring-1 focus:ring-neutral-900 focus:border-neutral-900';
function textInput(f, value, extra = "", attrs = "") {
  return `<input data-f="${f}" value="${esc(value ?? "")}" class="${INPUT_CLS} ${extra}" ${attrs}>`;
}
function dateInput(f, value, extra = "") {
  return `<input type="date" data-f="${f}" value="${esc(value ?? "")}" class="${INPUT_CLS} ${extra}">`;
}
function selectInput(f, value, options, allowEmpty = false, extra = "") {
  let opts = allowEmpty ? `<option value="">—</option>` : "";
  for (const o of options) opts += `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o)}</option>`;
  return `<div class="relative"><select data-f="${f}" class="${INPUT_CLS} appearance-none pr-7 ${extra}">${opts}</select>
    <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-neutral-400">${icon("chevron", 13)}</span></div>`;
}
function textArea(f, value, extra = "") {
  return `<textarea data-f="${f}" class="${INPUT_CLS} min-h-[52px] resize-y ${extra}">${esc(value ?? "")}</textarea>`;
}
function rowInput(field2, value, cls, type = "text", ph = "") {
  return `<input data-field="${field2}" type="${type}" placeholder="${esc(ph)}" value="${esc(value ?? "")}" class="${INPUT_CLS} ${cls}">`;
}
function rowSelect(field2, value, options, cls) {
  let opts = "";
  for (const o of options) opts += `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o)}</option>`;
  return `<div class="relative ${cls}"><select data-field="${field2}" class="${INPUT_CLS} appearance-none pr-7">${opts}</select>
    <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-neutral-400">${icon("chevron", 13)}</span></div>`;
}

/* Toast + confirm */
function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = "fixed bottom-5 right-5 z-[100] bg-neutral-900 text-white text-sm px-4 py-2.5 rounded-sm shadow-lg flex items-center gap-2";
  el.innerHTML = icon(kind === "error" ? "alert" : "check", 14, kind === "error" ? "text-rose-400" : "text-emerald-400") + esc(msg);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
/* Build the full portal URL for a manufacturer. PORTAL_BASE_URL is injected
   server-side from SHOPIFY_STORE_DOMAIN; falls back to just the suffix. */
const _PORTAL_BASE = (typeof PORTAL_BASE_URL !== 'undefined') ? PORTAL_BASE_URL : '';
function buildPortalUrl(linkToken) {
  if (!linkToken) return "";
  const suffix = "?token=" + linkToken;
  return _PORTAL_BASE ? _PORTAL_BASE + suffix : suffix;
}
/* Copy a manufacturer's full portal link to the clipboard. */
function copyPortalLink(m) {
  if (!m || !m.linkToken) { toast("No portal link yet — enable Portal Access and save", "error"); return; }
  const url = buildPortalUrl(m.linkToken);
  const fallback = () => { window.prompt("Copy this portal link:", url); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => toast("Full portal link copied!")).catch(fallback);
  } else fallback();
}
function confirmDialog(title, message, onConfirm) {
  const el = document.createElement("div");
  el.className = "fixed inset-0 z-[90] bg-black/40 flex items-center justify-center p-4";
  el.innerHTML = `<div class="bg-white rounded-sm w-full max-w-sm p-5 border border-neutral-200">
    <p class="text-sm font-semibold text-neutral-900 mb-1">${esc(title)}</p>
    <p class="text-sm text-neutral-500 mb-4">${esc(message)}</p>
    <div class="flex justify-end gap-2">
      <button data-a="cancel" class="px-3 py-1.5 text-sm rounded-sm border border-neutral-300 hover:bg-neutral-50">Cancel</button>
      <button data-a="ok" class="px-3 py-1.5 text-sm rounded-sm bg-rose-600 text-white hover:bg-rose-700">Delete</button>
    </div></div>`;
  el.querySelector('[data-a="cancel"]').onclick = () => el.remove();
  el.querySelector('[data-a="ok"]').onclick = () => { el.remove(); onConfirm(); };
  document.body.appendChild(el);
}
function setSaving(v) {
  savingFlag = v;
  const el = document.getElementById("saveState");
  if (el) el.innerHTML = v ? icon("loader", 11, "spin") + " Saving…" : "Shared workspace · live for everyone with this link";
}

/* Merge form values onto the original draft. data-f supports dot paths
   (e.g. cost.fabricCost); list rows start from their serialized base object
   (data-base) so fields without inputs are preserved — same as the JSX state. */
function mergeForm(base, root) {
  const d = JSON.parse(JSON.stringify(base || {}));
  root.querySelectorAll("[data-f]").forEach((el) => {
    const f = el.dataset.f;
    const v = el.type === "checkbox" ? el.checked : el.value;
    const parts = f.split(".");
    if (parts.length === 2) { d[parts[0]] = d[parts[0]] || {}; d[parts[0]][parts[1]] = v; }
    else d[f] = v;
  });
  root.querySelectorAll("[data-list]").forEach((container) => {
    d[container.dataset.list] = [...container.querySelectorAll(":scope > [data-row]")].map((rowEl) => {
      const baseEl = rowEl.querySelector("[data-base]");
      const o = baseEl ? JSON.parse(baseEl.value || "{}") : {};
      rowEl.querySelectorAll("[data-field]").forEach((inp) => { o[inp.dataset.field] = inp.type === "checkbox" ? inp.checked : inp.value; });
      return o;
    });
  });
  return d;
}

/* ============================== LOGIN ============================== */
function renderLogin() {
  document.getElementById("app").innerHTML = `
  <div class="min-h-screen flex items-center justify-center bg-neutral-950">
    <div class="w-full max-w-sm px-6">
      <div class="text-center mb-8">
        <div class="text-3xl font-black tracking-tight text-white">OFFCOMFRT</div>
        <div class="text-[11px] font-semibold tracking-[0.15em] text-neutral-500 uppercase mt-1">Product Development Control Tower</div>
      </div>
      <form id="loginForm" class="bg-neutral-900 border border-neutral-800 rounded-sm p-6 space-y-4">
        <label class="block">
          <span class="text-[10px] font-semibold tracking-wider uppercase text-neutral-500">Username <span class="text-neutral-600 normal-case tracking-none">(leave blank for super admin)</span></span>
          <input id="loginUser" type="text" autocomplete="username"
            class="mt-1 w-full bg-neutral-950 border border-neutral-700 rounded-sm px-3 py-2 text-sm text-white focus:outline-none focus:border-neutral-400">
        </label>
        <label class="block">
          <span class="text-[10px] font-semibold tracking-wider uppercase text-neutral-500">Password</span>
          <input id="loginPw" type="password" autocomplete="current-password" required
            class="mt-1 w-full bg-neutral-950 border border-neutral-700 rounded-sm px-3 py-2 text-sm text-white focus:outline-none focus:border-neutral-400">
        </label>
        <div id="loginErr" class="text-xs text-rose-400 hidden"></div>
        <button type="submit" class="w-full bg-white text-neutral-950 text-sm font-bold py-2.5 rounded-sm hover:bg-neutral-200 transition-colors">Enter Control Tower</button>
      </form>
    </div>
  </div>`;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("loginErr");
    errEl.classList.add("hidden");
    try {
      const pw = document.getElementById("loginPw").value;
      const user = document.getElementById("loginUser").value.trim();
      const payload = user ? { username: user, password: pw } : { password: pw };
      const body = await api("/api/admin/login", { method: "POST", body: JSON.stringify(payload) });
      TOKEN = body.token;
      MFR_SCOPE = body.manufacture_scope || (body.role === 'admin' ? 'full' : 'full');
      sessionStorage.setItem(TOKEN_KEY, TOKEN);
      sessionStorage.setItem(SCOPE_KEY, MFR_SCOPE);
      await boot();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove("hidden");
    }
  };
}

/* ============================== SHELL ============================== */
const ALL_NAV = [
  { key: "dashboard", label: "Dashboard", icon: "dashboard" },
  { key: "samples", label: "Samples", icon: "package" },
  { key: "production", label: "Production", icon: "truck" },
  { key: "manufacturers", label: "Manufacturers", icon: "factory" },
  { key: "techpacks", label: "Tech Packs", icon: "files" }
];
const SCOPE_TABS = {
  full: ["dashboard", "samples", "production", "manufacturers", "techpacks"],
  samples_techpacks: ["samples", "techpacks"]
};
function getNav() {
  const allowed = SCOPE_TABS[MFR_SCOPE] || SCOPE_TABS.full;
  return ALL_NAV.filter((n) => allowed.includes(n.key));
}

function renderShell() {
  document.getElementById("app").innerHTML = `
  <div class="min-h-screen bg-stone-50 text-neutral-900">
    <div class="bg-neutral-900 text-white">
      <div class="max-w-[1400px] mx-auto px-6 pt-6 pb-4">

function renderNav() {

/* ============================== DASHBOARD ============================== */
let dashFilters = { mfr: "All", cat: "All" };

  const active = scoped.filter((s) => s.stage !== "Closed");
  const overdue = scoped.filter((s) => statusLight(s) === "red");
  const dueThisWeek = active.filter((s) => { const d = daysRemaining(s); return d != null && d >= 0 && d <= 7; });
  const closed = scoped.filter((s) => s.stage === "Closed");
  const kpis = [
    { label: "Total Active Samples", value: active.length },

    { label: "Requiring Revision", value: scoped.filter((s) => s.status === "Revision Required").length },
    { label: "Avg Turnaround (days)", value: closed.length ? Math.round(closed.reduce((a, s) => a + (daysOpen(s) || 0), 0) / closed.length) : "—" },
    { label: "Total Sample Dev Cost", value: fmtINR(scoped.reduce((a, s) => a + costTotal(s.cost), 0)) }

  const maxStage = Math.max(1, ...stageCounts.map((s) => s.count));

  const statusBuckets = [
    { label: "On Track", count: samples.filter((s) => statusLight(s) === "green").length, color: "bg-emerald-500" },
    { label: "Due Soon", count: samples.filter((s) => statusLight(s) === "yellow").length, color: "bg-amber-500" },
    { label: "Overdue", count: samples.filter((s) => statusLight(s) === "red").length, color: "bg-rose-500" },
    { label: "Blocked", count: samples.filter((s) => s.status === "Revision Required" || s.status === "Rejected").length, color: "bg-neutral-700" },
    { label: "Approved", count: samples.filter((s) => s.approvalStatus === "Approved").length, color: "bg-neutral-400" }

  const upcoming = samples

  const mfrPerf = manufacturers.map((m) => {
    const ms = samples.filter((s) => s.manufacturer === m.name);
    const completed = ms.filter((s) => s.stage === "Closed");
    const avgT = completed.length ? Math.round(completed.reduce((a, s) => a + (daysOpen(s) || 0), 0) / completed.length) : null;
    const onTime = completed.length ? Math.round((completed.filter((s) => daysOverdue(s) === 0).length / completed.length) * 100) : null;
    const revRate = ms.length ? Math.round((ms.filter((s) => s.status === "Revision Required").length / ms.length) * 100) : 0;
    return { name: m.name, active: ms.filter((s) => s.stage !== "Closed").length, completed: completed.length, avgT, onTime, revRate, approved: ms.filter((s) => s.approvalStatus === "Approved").length };
  });

  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const label = d.toLocaleDateString("en-IN", { month: "short", year: "2-digit" });

    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const inRange = (iso) => { if (!iso) return false; const dd = new Date(iso + "T00:00:00"); return dd >= start && dd < end; };
    months.push({
      label,
      requested: samples.filter((s) => inRange(s.requestDate)).length,
      received: samples.filter((s) => inRange(s.dateReceived)).length,
      approved: samples.filter((s) => inRange(s.approvalDate)).length

  const maxMonth = Math.max(1, ...months.flatMap((m) => [m.requested, m.received, m.approved]));
  const costTotalAll = samples.reduce((a, s) => a + costTotal(s.cost), 0);

  ${sectionHeading("—", "Key Metrics")}

          <span class="text-sm font-mono font-bold text-neutral-900">${b.count}</span></div>`).join("")}
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-6">
    <div>
      ${sectionHeading("C", "Upcoming Deadlines — Next 10")}
      ${upcoming.length === 0 ? emptyState("clock", "Nothing due", "No open samples have an upcoming due date.") :
        `<div class="border border-neutral-200 rounded-sm bg-white overflow-hidden">${upcoming.map((s) =>
          `<button data-open-sample="${esc(s.id)}" class="w-full flex items-center gap-3 px-3 py-2 text-left border-b last:border-b-0 border-neutral-100 hover:bg-neutral-50">
            ${dot(statusLight(s))}
            <span class="font-mono text-[11px] text-neutral-500 w-32 truncate">${esc(s.id)}</span>
            <span class="text-xs text-neutral-800 flex-1 truncate">${esc(s.product)} · ${esc(s.version || "")}</span>
            <span class="text-[11px] text-neutral-500 w-20 truncate">${esc(s.actionOwner || "—")}</span>
            <span class="text-xs font-mono text-neutral-700 w-16 text-right">${daysRemaining(s)}d</span>
          </button>`).join("")}</div>`}
    </div>
    <div>
      ${sectionHeading("D", "Overdue Samples")}
      ${overdueList.length === 0 ? emptyState("check", "Nothing overdue", "Every open sample is within its due date.") :
        `<div class="border border-neutral-200 rounded-sm bg-white overflow-hidden">${overdueList.map((s) =>
          `<button data-open-sample="${esc(s.id)}" class="w-full flex items-center gap-3 px-3 py-2 text-left border-b last:border-b-0 border-neutral-100 hover:bg-rose-50/50">
            <span class="font-mono text-[11px] text-neutral-500 w-32 truncate">${esc(s.id)}</span>
            <span class="text-xs text-neutral-800 flex-1 truncate">${esc(s.product)}</span>
            <span class="text-[11px] text-neutral-500 w-28 truncate">${esc(s.manufacturer)}</span>
            <span class="text-xs font-mono text-rose-600 font-bold w-16 text-right">${daysOverdue(s)}d</span>
          </button>`).join("")}</div>`}
    </div>
  </div>

  ${sectionHeading("E", "Manufacturer Performance")}
  <div class="border border-neutral-200 rounded-sm bg-white overflow-x-auto">
    <table class="w-full text-xs">
      <thead><tr class="bg-neutral-900 text-white text-[10px] uppercase tracking-wide">
        <th class="text-left font-semibold px-3 py-2">Manufacturer</th>
        <th class="text-right font-semibold px-3 py-2">Active</th>
        <th class="text-right font-semibold px-3 py-2">Completed</th>
        <th class="text-right font-semibold px-3 py-2">Avg Turnaround</th>
        <th class="text-right font-semibold px-3 py-2">On-Time %</th>
        <th class="text-right font-semibold px-3 py-2">Revision Rate</th>
        <th class="text-right font-semibold px-3 py-2">Approved</th>
      </tr></thead>
      <tbody>${mfrPerf.map((m, i) => `<tr class="${i % 2 ? "bg-neutral-50" : ""}">
        <td class="px-3 py-2 font-medium text-neutral-800">${esc(m.name)}</td>
        <td class="px-3 py-2 text-right font-mono">${m.active}</td>
        <td class="px-3 py-2 text-right font-mono">${m.completed}</td>
        <td class="px-3 py-2 text-right font-mono">${m.avgT ?? "—"}</td>
        <td class="px-3 py-2 text-right font-mono">${m.onTime != null ? m.onTime + "%" : "—"}</td>
        <td class="px-3 py-2 text-right font-mono">${m.revRate}%</td>
        <td class="px-3 py-2 text-right font-mono">${m.approved}</td>
      </tr>`).join("")}</tbody>
    </table>

        ${kpi("Manufacturer-Paid", fmtINR(costByPaidBy("Manufacturer")))}
        ${kpi("Offcomfrt-Paid", fmtINR(costByPaidBy("Offcomfrt")))}
      </div>
    </div>
  </div>

  ${sectionHeading("H", "Production Snapshot")}
  ${productionOrders.length === 0 ? emptyState("truck", "No production orders yet", "Approve a sample and place your first bulk order from the Production tab.") :
    `<div class="border border-neutral-200 rounded-sm bg-white overflow-hidden">
      ${productionOrders.slice().sort((a, b) => LIGHT_ORDER[productionLight(a)] - LIGHT_ORDER[productionLight(b)]).map((o) =>
        `<button data-open-order="${esc(o.id)}" class="w-full flex items-center gap-4 px-4 py-2.5 text-left border-b last:border-b-0 border-neutral-100 hover:bg-neutral-50">
          ${dot(productionLight(o))}
          <span class="font-mono text-[11px] text-neutral-500 w-36 truncate">${esc(o.id)}</span>
          <span class="text-xs text-neutral-800 flex-1 truncate">${esc(o.product)} · ${orderQty(o).toLocaleString("en-IN")} pcs</span>
          <span class="text-[11px] text-neutral-500 w-40 truncate">${esc(o.manufacturer)}</span>
          <span class="text-xs text-neutral-600 w-32">${esc(o.currentStage || "")}</span>
          <span class="text-xs font-mono text-neutral-500 w-24 text-right">${fmtDate(o.expectedDelivery)}</span>
          <span class="text-xs font-mono text-neutral-700 w-24 text-right">${fmtINR(orderValue(o))}</span>
        </button>`).join("")}

  document.getElementById("dFmfr").onchange = (e) => { dashFilters.mfr = e.target.value; renderDashboard(main); };
  document.getElementById("dFcat").onchange = (e) => { dashFilters.cat = e.target.value; renderDashboard(main); };

  main.querySelectorAll("[data-open-order]").forEach((b) => b.onclick = () => openProductionDrawer(WS.productionOrders.find((o) => o.id === b.dataset.openOrder), false));
}
/* ============================== SAMPLES ============================== */
let sampleFilters = { q: "", mfr: "All", cat: "All", status: "All" };

function emptySample() {
  return {
    id: "", sku: "", product: "", category: "T-Shirt", version: "S1", type: "Fit Sample",
    requestDate: todayISO(), targetDate: "", manufacturer: "", manufacturerContact: "",
    fabric: "", gsm: "", composition: "", color: "", size: "M", fit: "Regular",
    techPackId: "", refLink: "",
    cost: { fabricCost: 0, trims: 0, cmt: 0, wash: 0, labels: 0, packaging: 0, courier: 0, other: 0, paidBy: "Offcomfrt", paymentStatus: "Pending", invoiceLink: "" },
    courierAwb: "", dateSent: "", dateReceived: "",
    status: "Requested", stage: "Request",
    mfrUpdate: "", feedback: "", changesRequired: "", nextAction: "", actionOwner: "Offcomfrt Product", waitingOn: "Offcomfrt", nextDue: "",
    approvalStatus: "Pending", approvedBy: "", approvalDate: "", finalDecision: "", notes: "",
    qc: [], revisions: [], comms: [], files: []
  };
}

function filteredSamples() {
  const f = sampleFilters;
  return WS.samples.filter((s) => {
    if (f.mfr !== "All" && s.manufacturer !== f.mfr) return false;
    if (f.cat !== "All" && s.category !== f.cat) return false;
    if (f.status !== "All" && s.status !== f.status) return false;
    if (f.q && !(`${s.id} ${s.product} ${s.sku || ""}`.toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  }).sort((a, b) => LIGHT_ORDER[statusLight(a)] - LIGHT_ORDER[statusLight(b)]);
}

function renderSamples(main) {
  const f = sampleFilters;
  main.innerHTML = `
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <div class="relative">
      <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-neutral-400">${icon("search", 13)}</span>
      <input id="sQ" value="${esc(f.q)}" placeholder="Search sample, product, SKU…"
        class="pl-8 pr-3 py-1.5 text-sm border border-neutral-300 rounded-sm w-64 focus:outline-none focus:ring-1 focus:ring-neutral-900 bg-white">
    </div>
    <select id="sMfr" class="border border-neutral-300 rounded-sm px-2 py-1.5 text-xs bg-white">
      ${["All", ...WS.manufacturers.map((m) => m.name)].map((o) => `<option ${o === f.mfr ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>
    <select id="sCat" class="border border-neutral-300 rounded-sm px-2 py-1.5 text-xs bg-white">
      ${["All", ...CATEGORY_OPTIONS].map((o) => `<option ${o === f.cat ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>
    <select id="sStatus" class="border border-neutral-300 rounded-sm px-2 py-1.5 text-xs bg-white">
      ${["All", ...STATUS_OPTIONS].map((o) => `<option ${o === f.status ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>
    <button id="sNew" class="ml-auto flex items-center gap-1.5 bg-neutral-900 text-white text-sm px-3 py-1.5 rounded-sm hover:bg-neutral-800">${icon("plus", 14)} New Sample</button>
  </div>
  <div id="sList"></div>`;

  const rerenderList = () => renderSamplesList(document.getElementById("sList"));
  document.getElementById("sQ").oninput = (e) => { sampleFilters.q = e.target.value; rerenderList(); };
  document.getElementById("sMfr").onchange = (e) => { sampleFilters.mfr = e.target.value; rerenderList(); };
  document.getElementById("sCat").onchange = (e) => { sampleFilters.cat = e.target.value; rerenderList(); };
  document.getElementById("sStatus").onchange = (e) => { sampleFilters.status = e.target.value; rerenderList(); };
  document.getElementById("sNew").onclick = () => openSampleDrawer(emptySample(), true);
  rerenderList();
}

function renderSamplesList(container) {
  const filtered = filteredSamples();
  if (filtered.length === 0) {
    container.innerHTML = emptyState("package", "No samples match", "Try clearing filters, or add your first sample.",
      `<button data-new-sample class="mt-3 text-xs font-semibold text-neutral-900 underline">+ New sample</button>`);
    const b = container.querySelector("[data-new-sample]");
    if (b) b.onclick = () => openSampleDrawer(emptySample(), true);
    return;
  }
  container.innerHTML = `<div class="border border-neutral-200 rounded-sm bg-white overflow-hidden">
    ${filtered.map((s) => {
      const light = statusLight(s);
      return `<div class="flex items-stretch border-b last:border-b-0 border-neutral-100 hover:bg-neutral-50 group">
        <div class="w-1 ${LIGHT_DOT[light]} shrink-0"></div>
        <button data-open="${esc(s.id)}" class="flex-1 flex items-center gap-4 px-4 py-3 text-left min-w-0">
          <div class="w-40 shrink-0"><div class="font-mono text-[11px] text-neutral-500 truncate">${esc(s.id)}</div></div>
          <div class="w-52 shrink-0 min-w-0">
            <div class="text-sm text-neutral-900 truncate">${esc(s.product)}</div>
            <div class="text-[11px] text-neutral-400">${esc(s.version || "")} · ${esc(s.category || "")}</div>
          </div>
          <div class="w-40 shrink-0 text-xs text-neutral-600 truncate">${esc(s.manufacturer)}</div>
          <div class="w-28 shrink-0 text-xs text-neutral-600">${esc(s.stage || "")}</div>
          <div class="w-36 shrink-0 text-xs text-neutral-600 truncate">${esc(s.status || "")}</div>
          <div class="w-24 shrink-0 text-xs font-mono text-neutral-500">${fmtDate(s.nextDue || s.targetDate)}</div>
          <div class="w-24 shrink-0">${statusPill(light)}</div>
        </button>
        <button data-del="${esc(s.id)}" class="px-3 opacity-0 group-hover:opacity-100 text-neutral-300 hover:text-rose-600 transition-opacity">${icon("trash", 14)}</button>
      </div>`;
    }).join("")}
  </div>`;
  container.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openSampleDrawer(WS.samples.find((s) => s.id === b.dataset.open), false));
  container.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    const s = WS.samples.find((x) => x.id === b.dataset.del);
    confirmDialog("Delete this sample?", `${s.id} — ${s.product} will be permanently removed.`, async () => {
      try {
        setSaving(true);
        await api("/api/manufacture/admin/samples?id=" + encodeURIComponent(s.id), { method: "DELETE" });
        WS.samples = WS.samples.filter((x) => x.id !== s.id);
        toast("Deleted");
        renderSamplesList(container);
      } catch (err) { toast(err.message, "error"); } finally { setSaving(false); }
    });
  });
}

function emptyProductionOrder() {
  return {

    poDate: todayISO(), expectedDelivery: "", actualDelivery: "",
    breakdown: [], unitPrice: 0, advancePaid: 0, paymentStatus: "Pending",
    currentStage: "PO Placed", actionOwner: "Offcomfrt Purchase", waitingOn: "Manufacturer",
    nextAction: "", nextActionDue: "", shippingMethod: "", trackingNumber: "", notes: "",

function setDrawerTab(overlay, tab) {
  overlay.querySelectorAll("[data-tab]").forEach((b) => {
    const on = b.dataset.tab === tab;
    b.className = `flex items-center gap-1.5 px-3 py-2 text-xs font-medium border-b-2 -mb-px whitespace-nowrap ${on ? "border-neutral-900 text-neutral-900" : "border-transparent text-neutral-400 hover:text-neutral-600"}`;

function baseInput(row) { return `<input type="hidden" data-base value="${esc(JSON.stringify(row || {}))}">`; }
function qcBadge() { return `<span class="text-[10px] text-neutral-400">manual</span>`; }

function updateQcBadges(listEl) {
  listEl.querySelectorAll(":scope > [data-row]").forEach((row) => {
    const get = (f) => { const i = row.querySelector(`[data-field="${f}"]`); return i ? i.value : ""; };
    const spec = get("spec"), tol = get("tolerance"), act = get("actual");
    const badge = row.querySelector("[data-pass]");
    if (!badge) return;
    if (spec === "" || tol === "" || act === "") { badge.innerHTML = qcBadge(); return; }
    const pass = Math.abs(Number(act) - Number(spec)) <= Number(tol);
    badge.innerHTML = pass ? `<span class="text-[11px] font-semibold text-emerald-600">Pass</span>` : `<span class="text-[11px] font-semibold text-rose-600">Fail</span>`;
  });
}

/* Generic list wiring inside a drawer: add/remove rows */
function wireLists(overlay, templates) {
  overlay.addEventListener("click", (e) => {
    const del = e.target.closest("[data-del-row]");
    if (del) { del.closest("[data-row]").remove(); return; }
    const add = e.target.closest("[data-add]");
    if (add) {
      const key = add.dataset.add;
      const list = overlay.querySelector(`[data-list="${key}"]`);
      list.insertAdjacentHTML("beforeend", templates[key]());
      if (key === "qc") updateQcBadges(list);
    }
  });
}
function upsertIn(list, record) {
  const i = list.findIndex((x) => x.id === record.id);
  if (i >= 0) list[i] = record; else list.push(record);
}

    comms: () => commRowHtml({ id: uid("COM"), date: todayISO(), from: "", to: "", message: "", response: "", decision: "", actionOwner: "", dueDate: "", status: "Open" }),
    files: () => fileRowHtml({ id: uid("FL"), type: "Reference Image", description: "", link: "", uploadedBy: "", date: todayISO() }, FILE_TYPE_OPTIONS)
  });

  const form = overlay.querySelector("[data-form]");
  overlay.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => setDrawerTab(overlay, b.dataset.tab));
  overlay.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => overlay.remove());
  updateQcBadges(form.querySelector('[data-list="qc"]'));

  // Live bits: approval banner, QC pass/fail, cost total
  form.addEventListener("input", (e) => {
    const qcList = e.target.closest('[data-list="qc"]');
    if (qcList) updateQcBadges(qcList);
    if (e.target.dataset.f && e.target.dataset.f.startsWith("cost.")) {
      const draft = mergeForm(base, form);
      form.querySelector("[data-cost-total]").textContent = fmtINR(costTotal(draft.cost));
    }
  });
  form.addEventListener("change", (e) => {
    if (e.target.dataset.f === "approvalStatus") {
      overlay.querySelector("[data-place-banner]").classList.toggle("hidden", e.target.value !== "Approved");
      overlay.querySelector("[data-place-banner]").classList.toggle("flex", e.target.value === "Approved");
    }
  });

  overlay.querySelector("[data-place-order]").onclick = () => {
    const draft = mergeForm(base, form);
    const blank = emptyProductionOrder();
    const skuSlug = (draft.sku || draft.id).replace(/[^A-Z0-9]/gi, "").toUpperCase();
    const existingNums = WS.productionOrders
      .filter((o) => o.id.startsWith(`PO-${skuSlug}-B`))
      .map((o) => parseInt(o.id.split("-B").pop(), 10))
      .filter((n) => !isNaN(n));
    const nextNum = existingNums.length ? Math.max(...existingNums) + 1 : 1;
    overlay.remove();
    TAB = "production"; renderNav(); renderMain();
    openProductionDrawer({
      ...blank,
      id: `PO-${skuSlug}-B${nextNum}`,
      sampleId: draft.id, sku: draft.sku, product: draft.product, category: draft.category,
      manufacturer: draft.manufacturer, manufacturerContact: draft.manufacturerContact
    }, true);
  };

  overlay.querySelector("[data-save]").onclick = async () => {
    const draft = mergeForm(base, form);
    const errEl = overlay.querySelector("[data-err]");
    const idTaken = isNew && WS.samples.some((s) => s.id === draft.id.trim());
    if (idTaken) { errEl.textContent = `An entry with ID "${draft.id.trim()}" already exists — use a different ID`; return; }
    if (!draft.id.trim() || !draft.product.trim() || !draft.manufacturer.trim()) {
      errEl.textContent = "Sample ID, product and manufacturer are required"; return;
    }
    draft.id = draft.id.trim();
    try {
      setSaving(true);
      const body = await api("/api/manufacture/admin/samples", {
        method: isNew ? "POST" : "PUT", body: JSON.stringify(draft)
      });
      upsertIn(WS.samples, body.record);
      toast(isNew ? "Sample added" : "Sample updated");
      overlay.remove();
      renderMain();
    } catch (err) {
      errEl.textContent = err.message;
    } finally { setSaving(false); }
  };
  setDrawerTab(overlay, "overview");
}

function stageStepper(stage) {
  const idx = PROD_STAGE_OPTIONS.indexOf(stage);
  return `<div class="flex items-center overflow-x-auto pb-1">${PROD_STAGE_OPTIONS.map((s, i) =>
    `<div class="flex items-center shrink-0">
      <div class="flex flex-col items-center gap-1">
        <div class="w-2.5 h-2.5 rounded-full ${i < idx ? "bg-neutral-900" : i === idx ? "bg-emerald-500" : "bg-neutral-200"}"></div>
        <div class="text-[9px] whitespace-nowrap ${i === idx ? "font-bold text-neutral-900" : "text-neutral-400"}">${esc(s)}</div>
      </div>
      ${i < PROD_STAGE_OPTIONS.length - 1 ? `<div class="w-8 h-px mb-4 ${i < idx ? "bg-neutral-900" : "bg-neutral-200"}"></div>` : ""}
    </div>`).join("")}</div>`;
}

    try {
      setSaving(true);
      const body = await api("/api/manufacture/admin/manufacturers/" + encodeURIComponent(base.id) + "/regenerate-link", { method: "POST" });
      base.linkToken = body.record.linkToken;
      upsertIn(WS.manufacturers, body.record);
      overlay.querySelector("[data-token]").textContent = buildPortalUrl(base.linkToken);
      toast("New portal link generated — old link stopped working");
    } catch (err) { toast(err.message, "error"); } finally { setSaving(false); }
  };
  overlay.querySelector("[data-save]").onclick = async () => {
    const draft = mergeForm(base, form);
    const errEl = overlay.querySelector("[data-err]");
    if (!draft.name.trim()) { errEl.textContent = "Manufacturer name is required"; return; }
    if (draft.portalAccess && !String(draft.portalPassword || "").trim()) { errEl.textContent = "Portal password is required when Portal Access is enabled"; return; }
    try {
      setSaving(true);
      const isNew = !base.id;
      const body = await api("/api/manufacture/admin/manufacturers", {
        method: isNew ? "POST" : "PUT", body: JSON.stringify(draft)
      });
      upsertIn(WS.manufacturers, body.record);
      toast(isNew ? "Manufacturer added" : "Manufacturer updated");
      overlay.remove();
      renderMain();
    } catch (err) {
      errEl.textContent = err.message;
    } finally { setSaving(false); }
  };
}

/* ============================== TECH PACK MODAL ============================== */
function openTechPackModal(initial) {
  const base = JSON.parse(JSON.stringify(initial));
  const overlay = document.createElement("div");
  overlay.className = "fixed inset-0 z-[80] bg-black/40 flex items-center justify-center p-4";
  overlay.innerHTML = `
  <div class="bg-white w-full max-w-lg rounded-sm border border-neutral-200 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-4 border-b border-neutral-200">
      <div class="text-sm font-semibold">${base.__isNew ? "New Tech Pack Version" : "Edit Tech Pack"}</div>
      <button data-close class="text-neutral-400 hover:text-neutral-700">${icon("x", 18)}</button>
    </div>
    <div class="p-5 grid grid-cols-2 gap-3" data-form>
      ${field("Tech Pack ID", textInput("id", base.id, base.__isNew ? "" : "bg-neutral-100 text-neutral-500", base.__isNew ? 'placeholder="TP-SKU-V1"' : "disabled"))}
      ${field("SKU", textInput("sku", base.sku))}
      ${field("Product", textInput("product", base.product), true)}
      ${field("Version", textInput("version", base.version))}
      ${field("Status", selectInput("status", base.status, TP_STATUS_OPTIONS))}
      ${field("Link", textInput("link", base.link), true)}
      ${field("Created By", textInput("createdBy", base.createdBy))}
      ${field("Created Date", dateInput("createdDate", base.createdDate))}
      ${field("Manufacturer Questions", textArea("manufacturerQuestions", base.manufacturerQuestions), true)}
      ${field("Notes", textArea("notes", base.notes), true)}
    </div>
    <div class="flex justify-end gap-2 px-5 py-4 border-t border-neutral-200">
      <div class="flex-1 text-xs text-rose-500" data-err></div>
      <button data-close class="px-4 py-2 text-sm rounded-sm border border-neutral-300 hover:bg-neutral-50">Cancel</button>
      <button data-save class="px-4 py-2 text-sm rounded-sm bg-neutral-900 text-white hover:bg-neutral-800 disabled:opacity-30">Save</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const form = overlay.querySelector("[data-form]");
  overlay.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => overlay.remove());
  overlay.querySelector("[data-save]").onclick = async () => {
    const draft = mergeForm(base, form);
    const errEl = overlay.querySelector("[data-err]");
    if (!draft.id.trim()) { errEl.textContent = "Tech pack ID is required"; return; }
    draft.id = draft.id.trim();
    try {
      setSaving(true);
      const isNew = !!base.__isNew;
      const body = await api("/api/manufacture/admin/techpacks", {
        method: isNew ? "POST" : "PUT", body: JSON.stringify(draft)
      });
      upsertIn(WS.techPacks, body.record);
      toast(isNew ? "Tech pack added" : "Tech pack updated");
      overlay.remove();
      renderMain();
    } catch (err) {
      errEl.textContent = err.message;
    } finally { setSaving(false); }
  };
}

/* ============================== BOOT ============================== */
async function boot() {
  try {
    setSaving(true);
    // Resolve scope from server if not already set from login
    if (!sessionStorage.getItem(SCOPE_KEY)) {
      try {
        const me = await api("/api/admin/operators/me");
        MFR_SCOPE = me.manufacture_scope || "full";
        sessionStorage.setItem(SCOPE_KEY, MFR_SCOPE);
      } catch (e) { /* super admin or error — default full */ }
    }
    const body = await api("/api/manufacture/admin/workspace");
    WS = body.workspace;
    WS.samples = WS.samples || []; WS.manufacturers = WS.manufacturers || [];
    WS.techPacks = WS.techPacks || []; WS.productionOrders = WS.productionOrders || [];
    const nav = getNav();
    if (!nav.find((n) => n.key === TAB)) TAB = nav[0].key;
    renderShell();
  } catch (err) {
    if (err.status === 401) { TOKEN = null; sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(SCOPE_KEY); MFR_SCOPE = "full"; renderLogin(); }
    else {
      document.getElementById("app").innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-sm text-neutral-500">${esc(err.message)}</div></div>`;
    }
  } finally { setSaving(false); }
}
if (TOKEN) boot(); else renderLogin();
</script>
